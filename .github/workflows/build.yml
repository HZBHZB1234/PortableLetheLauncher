name: Build and Release (portable)

# Produces prebuilt portable artifacts only. The Hub downloads these; it never
# compiles Rust. The raw exe is kept for the launcher's self-updater, and the
# zip is the distribution unit for a game/client package.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lethe-launcher/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: lethe-launcher
        run: npm ci

      - name: Verify frontend and Rust units
        working-directory: lethe-launcher
        run: |
          npm run build
          npm test
          cd src-tauri
          cargo test --lib

      - name: Build Tauri app
        working-directory: lethe-launcher
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Prepare release artifacts
        shell: powershell
        run: |
          $exe = "lethe-launcher\src-tauri\target\release\LimbusCompany.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }

          # Raw exe: the updater downloads and swaps this exact file.
          Copy-Item $exe -Destination "LimbusCompany.exe" -Force

          # Portable zip: what the Hub downloads to assemble a client package.
          $stage = "portable-staging"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exe -Destination "$stage\LimbusCompany.exe" -Force
          Copy-Item "README.md" -Destination "$stage\README.md" -Force
          Copy-Item "PROFILE_FORMAT.md" -Destination "$stage\PROFILE_FORMAT.md" -Force
          $zip = "PortableLetheLauncher-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip

          # SHA-256 of the exact bytes clients fetch.
          $shaExe = (Get-FileHash "LimbusCompany.exe" -Algorithm SHA256).Hash.ToLower()
          $shaZip = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$shaExe  LimbusCompany.exe",
            "$shaZip  $zip"
          ) | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $version) { $version = "0.0.0" }

          $latestJson = @{
            version = $version
            notes = "Release ${{ github.ref_name }}"
            download_url = "https://github.com/${{ github.repository }}/releases/latest/download/LimbusCompany.exe"
            sha256 = $shaExe
          } | ConvertTo-Json

          $latestJson | Out-File -FilePath latest.json -Encoding utf8

          Write-Host "Build version: $version"
          Get-Content "SHA256SUMS.txt"
          Get-ChildItem "LimbusCompany.exe", $zip, "latest.json", "SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortableLetheLauncher-build-${{ github.run_number }}
          path: |
            LimbusCompany.exe
            PortableLetheLauncher-win-x64.zip
            latest.json
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LimbusCompany.exe
            PortableLetheLauncher-win-x64.zip
            latest.json
            SHA256SUMS.txt
          body_path: SHA256SUMS.txt
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release on push to main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build (${{ github.run_number }})
          body: |
            🚀 Automated portable build from commit `${{ github.sha }}`.

            Download `PortableLetheLauncher-win-x64.zip`, unpack it into the game
            directory next to `UnityPlayer.dll`, and run `LimbusCompany.exe`.
            Checksums are attached as `SHA256SUMS.txt`.
          files: |
            LimbusCompany.exe
            PortableLetheLauncher-win-x64.zip
            latest.json
            SHA256SUMS.txt
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
